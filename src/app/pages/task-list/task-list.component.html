<div class="container mt-5">

  <!-- Header -->
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4">
    <h2 class="mb-3 mb-md-0">Your Tasks</h2>
    <button class="btn btn-success" routerLink="/task-form">
      <i class="bi bi-plus-circle me-2"></i> Add Task
    </button>
  </div>

  <!-- Filter -->
  <div class="mb-3">
    <label class="form-label fw-bold">Filter by Status:</label>
    <select class="form-select w-auto"
            [(ngModel)]="filter"
            (change)="applyFilter()">
      <option value="">All</option>
      <option value="Pending">Pending</option>
      <option value="Completed">Completed</option>
    </select>
  </div>

  <!-- Desktop Table -->
  <div class="card shadow-sm d-none d-md-block">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-dark">
            <tr>
              <th>Title</th>
              <th>Description</th>
              <th>Due Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let task of filteredTasks">
              <td>{{task.title}}</td>
              <td style="max-width: 300px; word-wrap: break-word; white-space: normal;">
                {{task.description}}
              </td>
              <td>{{task.dueDate | date:'dd-MM-yyyy'}}</td>
              <td>
                <span class="badge"
                  [ngClass]="{
                    'bg-success': task.status === 'Completed',
                    'bg-warning text-dark': task.status === 'Pending',
                    'bg-info text-dark': task.status === 'In Progress'
                  }">
                  {{task.status}}
                </span>
              </td>
              <td class="d-flex flex-wrap gap-2">
                <button class="btn btn-sm btn-primary" (click)="editTask(task.id)">
                  <i class="bi bi-pencil-square"></i> Edit
                </button>
                <button class="btn btn-sm btn-danger" (click)="deleteTask(task.id!)">
                  <i class="bi bi-trash"></i> Delete
                </button>
              </td>
            </tr>

            <tr *ngIf="filteredTasks.length === 0">
              <td colspan="5" class="text-center py-3">No tasks found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Mobile Cards -->
  <div class="d-md-none">
    <div *ngFor="let task of filteredTasks" class="card mb-3 shadow-sm">
      <div class="card-body">
        <h5>{{task.title}}</h5>
        <p>{{task.description}}</p>
        <p><strong>Due:</strong> {{task.dueDate}}</p>

        <span class="badge"
          [ngClass]="{
            'bg-success': task.status === 'Completed',
            'bg-warning text-dark': task.status === 'Pending',
            'bg-info text-dark': task.status === 'In Progress'
          }">
          {{task.status}}
        </span>

        <div class="mt-2 d-flex gap-2 flex-wrap">
          <button class="btn btn-sm btn-primary" (click)="editTask(task.id)">
            <i class="bi bi-pencil-square"></i> Edit
          </button>
          <button class="btn btn-sm btn-danger" (click)="deleteTask(task.id!)">
            <i class="bi bi-trash"></i> Delete
          </button>
        </div>
      </div>
    </div>

    <!-- No tasks message for mobile -->
    <div *ngIf="filteredTasks.length === 0" class="text-center py-3">
      No tasks found.
    </div>
  </div>

</div>
